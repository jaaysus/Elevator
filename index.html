<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#155eb0">
<title>Elevation</title>
<style>
:root{color-scheme:dark;--bg:#155eb0;--ink:#fff;--soft:rgba(255,255,255,.76)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--ink);transition:background-color 1s ease}
main{min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding:max(28px,env(safe-area-inset-top)) 24px max(30px,env(safe-area-inset-bottom));max-width:720px;margin:auto}
.top{display:flex;align-items:center;justify-content:flex-end;min-height:28px}
.dot{height:9px;width:9px;border-radius:50%;background:rgba(255,255,255,.45)}.dot.ok{background:#b8ffc9}.dot.bad{background:#ffb9b9}
.center{display:grid;place-items:center;align-content:center;flex:1;min-height:260px}
.elevation{display:flex;align-items:baseline;justify-content:center;gap:9px;font-weight:600;letter-spacing:-.075em;font-variant-numeric:tabular-nums;line-height:1}
#meters{font-size:clamp(105px,25vw,194px)}.unit{font-size:clamp(29px,7vw,46px);letter-spacing:-.03em;font-weight:450}
.bottom{width:100%}.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:18px}
button{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;color:white;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:13px;min-height:50px;cursor:pointer;touch-action:manipulation;transition:background .2s ease}
button.active{background:rgba(255,255,255,.92);color:#173b4b;border-color:transparent}button:focus-visible{outline:3px solid white;outline-offset:3px}
.timer{height:19px;display:flex;justify-content:center;align-items:center;font-size:12px;font-variant-numeric:tabular-nums;opacity:.75;margin-bottom:14px}
.stats{border-top:1px solid rgba(255,255,255,.22);padding-top:17px;display:grid;grid-template-columns:1fr auto;gap:12px 8px;font-size:14px;font-variant-numeric:tabular-nums}
.label{color:var(--soft)}.value{text-align:right;font-weight:500}
@media(max-width:350px){main{padding-left:16px;padding-right:16px}.modes{gap:5px}button{font-size:12px}#meters{font-size:105px}}
@media(prefers-reduced-motion:reduce){body,button{transition:none}}
</style>
</head>
<body>
<main>
  <header class="top"><span id="network" class="dot" role="status" aria-label="Checking connection"></span></header>
  <section class="center" aria-live="polite" aria-atomic="true"><div class="elevation"><span id="meters">—</span><span class="unit">m</span></div></section>
  <footer class="bottom">
    <div class="modes" role="group" aria-label="Update frequency">
      <button type="button" data-mode="5">5s</button>
      <button type="button" data-mode="10" class="active">10s</button>
      <button type="button" data-mode="15">15s</button>
      <button type="button" data-mode="instant">Instant</button>
    </div>
    <div class="timer" id="timer" aria-live="off"></div>
    <div class="stats">
      <span class="label">Latitude</span><span id="latitude" class="value">—</span>
      <span class="label">Longitude</span><span id="longitude" class="value">—</span>
      <span class="label">Accuracy</span><span id="accuracy" class="value">—</span>
    </div>
  </footer>
</main>
<script>
(()=>{
  'use strict';
  const $=id=>document.getElementById(id);
  const meters=$('meters'),lat=$('latitude'),lon=$('longitude'),accuracy=$('accuracy'),network=$('network'),timer=$('timer');
  const buttons=[...document.querySelectorAll('[data-mode]')];
  let mode='10', watchId=null, intervalId=null, countdownId=null, nextUpdate=0;
  let latestPosition=null, requestController=null, requestSerial=0, lastInstantCall=0, lastInstantCoords=null, instantPending=null;
  const geoOptions={enableHighAccuracy:true,maximumAge:0,timeout:12000};
  function status(ok){network.className='dot '+(ok?'ok':'bad');network.setAttribute('aria-label',ok?'Elevation service online':'Location or elevation unavailable')}
  function paint(e){
    // Sea level: ocean blue. Higher ground gradually changes through cyan toward green.
    const t=Math.min(1,Math.max(0,e)/1000);
    const hue=210-75*t, light=36-5*t;
    document.body.style.backgroundColor=`hsl(${hue.toFixed(1)} 66% ${light.toFixed(1)}%)`;
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.content=`hsl(${hue.toFixed(1)} 66% ${light.toFixed(1)}%)`;
  }
  function showPosition(pos){
    latestPosition=pos;
    lat.textContent=pos.coords.latitude.toFixed(6)+'°';
    lon.textContent=pos.coords.longitude.toFixed(6)+'°';
    accuracy.textContent=Math.round(pos.coords.accuracy)+' m';
  }
  async function getElevation(pos){
    if(!pos)return;
    if(requestController)requestController.abort();
    const serial=++requestSerial;
    const controller=new AbortController();requestController=controller;
    const timeout=setTimeout(()=>controller.abort(),10000);
    try{
      const {latitude,longitude}=pos.coords;
      const url=`https://api.open-meteo.com/v1/elevation?latitude=${encodeURIComponent(latitude)}&longitude=${encodeURIComponent(longitude)}`;
      const response=await fetch(url,{signal:controller.signal,cache:'no-store'});
      if(!response.ok)throw new Error('HTTP '+response.status);
      const json=await response.json();const elev=Number(json.elevation?.[0]);
      if(!Number.isFinite(elev))throw new Error('Invalid elevation');
      if(serial!==requestSerial)return;
      meters.textContent=Math.round(elev).toLocaleString('en-US');paint(elev);status(true);
    }catch(err){if(serial===requestSerial && err.name!=='AbortError')status(false)}
    finally{clearTimeout(timeout);if(requestController===controller)requestController=null}
  }
  function readNow(){
    if(!navigator.geolocation){status(false);return}
    navigator.geolocation.getCurrentPosition(pos=>{showPosition(pos);getElevation(pos)},()=>status(false),geoOptions);
  }
  function instantUpdate(pos){
    showPosition(pos);
    const coords=pos.coords;
    // Ignore repeated same-coordinate fixes, and limit requests to at most one per second.
    const moved=!lastInstantCoords || Math.abs(coords.latitude-lastInstantCoords[0])>0.000003 || Math.abs(coords.longitude-lastInstantCoords[1])>0.000003;
    if(!moved)return;
    const elapsed=Date.now()-lastInstantCall;
    const run=()=>{lastInstantCall=Date.now();lastInstantCoords=[coords.latitude,coords.longitude];instantPending=null;getElevation(pos)};
    if(elapsed>=1000){clearTimeout(instantPending);instantPending=null;run()}
    else if(!instantPending)instantPending=setTimeout(run,1000-elapsed);
  }
  function reset(){
    if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
    clearInterval(intervalId);clearInterval(countdownId);clearTimeout(instantPending);
    intervalId=countdownId=instantPending=null;
    if(requestController)requestController.abort();requestController=null;requestSerial++;
  }
  function start(newMode){
    reset();mode=newMode;lastInstantCoords=null;lastInstantCall=0;
    buttons.forEach(b=>{const selected=b.dataset.mode===mode;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});
    if(mode==='instant'){
      timer.textContent='LIVE';
      if(!navigator.geolocation){status(false);return}
      watchId=navigator.geolocation.watchPosition(instantUpdate,()=>status(false),geoOptions);
    }else{
      const seconds=Number(mode),duration=seconds*1000;
      readNow();nextUpdate=Date.now()+duration;
      const draw=()=>{timer.textContent=Math.max(0,Math.ceil((nextUpdate-Date.now())/1000))+'s'};
      draw();
      intervalId=setInterval(()=>{readNow();nextUpdate=Date.now()+duration;draw()},duration);
      countdownId=setInterval(draw,200);
    }
  }
  buttons.forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)start(mode)});
  start('10');
})();
</script>
</body>
</html>
